# Light, Dark and "Use system setting" all come from the two sections below —
# Streamlit's ⋮ → Settings menu lists them once both are defined. The glass
# card / pill styling on top of these lives in lib/style.py.
[theme]
font = "Plus Jakarta Sans:https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap, sans-serif"
headingFont = "Plus Jakarta Sans, sans-serif"
baseRadius = "14px"
buttonRadius = "full"
showSidebarBorder = false
showWidgetBorder = true

[theme.light]
primaryColor = "#18181b"
backgroundColor = "#eef0f4"
secondaryBackgroundColor = "#f6f7fa"
textColor = "#17171c"
linkColor = "#6d5ce8"
borderColor = "#e2e4ea"
dataframeHeaderBackgroundColor = "#f3f4f7"

[theme.light.sidebar]
# frosted light glass (lib/style.py draws the glass itself)
primaryColor = "#6d5ce8"
backgroundColor = "#f3f2fa"
secondaryBackgroundColor = "#ffffff"
textColor = "#17171c"
borderColor = "#e2e4ea"

[theme.dark]
primaryColor = "#a594f9"
backgroundColor = "#0b0b0f"
secondaryBackgroundColor = "#17171d"
textColor = "#f2f2f5"
linkColor = "#b9acfb"
borderColor = "#25252d"
dataframeHeaderBackgroundColor = "#16161c"

[theme.dark.sidebar]
primaryColor = "#c9bffc"
backgroundColor = "#18181f"
secondaryBackgroundColor = "#1f1f26"
textColor = "#ececf1"
borderColor = "#2a2a33"

[server]
runOnSave = true

[browser]
gatherUsageStats = false
